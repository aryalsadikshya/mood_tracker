<!DOCTYPE html>
<html>
<head>
  <meta
          name="google-signin-client_id"
          content="570674157033-868arr8t9djra53aoolevahvm15eqhuq.apps.googleusercontent.com"
  >

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
          name="description"
          content="MindBloom mood tracking, journaling, and emotional wellness app"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta
          name="apple-mobile-web-app-status-bar-style"
          content="default"
  >
  <meta
          name="apple-mobile-web-app-title"
          content="MindBloom"
  >

  <link
          rel="apple-touch-icon"
          href="icons/Icon-192.png"
  >

  <link
          rel="icon"
          type="image/png"
          href="favicon.png"
  >

  <title>MindBloom</title>

  <link
          rel="manifest"
          href="manifest.json"
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #FDFCF0;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #FDFCF0;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 250ms ease,
        visibility 250ms ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 24px;
      text-align: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .loading-logo {
      width: 76px;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 18px;

      border-radius: 50%;

      background: #FFEEF3;

      font-size: 38px;
      line-height: 1;

      animation: bloomPulse 1.4s ease-in-out infinite;
    }

    .loading-title {
      margin-bottom: 8px;

      color: #263238;

      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .loading-message {
      color: #6F6868;

      font-size: 14px;
      line-height: 1.5;
    }

    .loading-dots {
      display: flex;
      gap: 7px;

      margin-top: 18px;
    }

    .loading-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #7FAFC3;

      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .loading-dot:nth-child(2) {
      animation-delay: 150ms;
    }

    .loading-dot:nth-child(3) {
      animation-delay: 300ms;
    }

    @keyframes bloomPulse {
      0%,
      100% {
        transform: scale(0.94);
        opacity: 0.72;
      }

      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    @keyframes dotBounce {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      30% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    @media (prefers-color-scheme: dark) {
      html,
      body {
        background: #101A26;
      }

      #loading-screen {
        background: #101A26;
      }

      .loading-logo {
        background: #1B2A3A;
      }

      .loading-title {
        color: #F5F3EF;
      }

      .loading-message {
        color: #B8C2CC;
      }

      .loading-dot {
        background: #8FBBD0;
      }
    }
  </style>
</head>

<body>
<div id="loading-screen">
  <div class="loading-content">
    <div class="loading-logo">✿</div>

    <div class="loading-title">
      MindBloom
    </div>

    <div class="loading-message">
      Preparing your calm space...
    </div>

    <div class="loading-dots">
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
    </div>
  </div>
</div>

<script>
  window.addEventListener(
    'flutter-first-frame',
    function () {
      const loadingScreen =
        document.getElementById('loading-screen');

      if (!loadingScreen) {
        return;
      }

      loadingScreen.classList.add('hidden');

      window.setTimeout(
        function () {
          loadingScreen.remove();
        },
        300
      );
    }
  );

  window.setTimeout(
    function () {
      const loadingScreen =
        document.getElementById('loading-screen');

      if (loadingScreen) {
        loadingScreen.classList.add('hidden');
      }
    },
    10000
  );
</script>

<script
        src="flutter_bootstrap.js"
        async
></script>
</body>
</html>
